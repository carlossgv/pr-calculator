# FILE: .github/workflows/build-push-deploy.yml
name: Build & Push (API+WEB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME_API: ghcr.io/${{ github.repository }}-api
  IMAGE_NAME_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  # =========================
  # BUILD & PUSH
  # =========================
  build_and_push:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select platforms
        id: platforms
        run: |
          # Single-arch for now (amd64 only).
          # To re-enable multi-arch for main/tags, swap in the conditional below:
          # if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_type }}" = "tag" ]; then
          #   echo "value=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          # else
          #   echo "value=linux/amd64" >> $GITHUB_OUTPUT
          # fi
          echo "value=linux/amd64" >> $GITHUB_OUTPUT

      - name: Docker meta (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_API }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
            type=ref,event=tag

      - name: Docker meta (WEB)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_WEB }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
            type=ref,event=tag

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            VITE_APP_ENV=prod
            VITE_APP_TITLE=PR Calculator
            VITE_API_BASE=${{ vars.API_URL }}
            VITE_APP_VERSION=${{ github.sha }}
