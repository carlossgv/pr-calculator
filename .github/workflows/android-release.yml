name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches Android version
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*$/\1/p' apps/native/android/app/build.gradle)
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version v${version_name}." >&2
            exit 1
          fi

      - name: Build web app
        run: pnpm --filter @repo/web build:native

      - name: Sync Android project
        run: pnpm --filter @repo/native exec cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prcalc-release.keystore"

      - name: Build signed APK
        working-directory: apps/native/android
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/prcalc-release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare release assets
        run: |
          \cp apps/native/android/app/build/outputs/apk/release/app-release.apk "pr-calculator-${GITHUB_REF_NAME}.apk"
          sha256sum "pr-calculator-${GITHUB_REF_NAME}.apk" > "pr-calculator-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "pr-calculator-${GITHUB_REF_NAME}.apk" \
            "pr-calculator-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "PR Calculator ${GITHUB_REF_NAME}"
